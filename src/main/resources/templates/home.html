<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header-client :: header}"></div>
    
    <div class="container mt-4">
        <!-- Search and Filter Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/products}" method="get" class="row g-3">
                            <div class="col-md-3">
                                <input type="text" class="form-control" name="name" th:value="${name}" placeholder="Tìm kiếm sản phẩm...">
                            </div>
                            <div class="col-md-2">
                                <select class="form-select" name="categoryId">
                                    <option value="">Tất cả danh mục</option>
                                    <option th:each="category : ${categories}" 
                                            th:value="${category.id}" 
                                            th:text="${category.name}"
                                            th:selected="${categoryId != null and categoryId == category.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" name="minPrice" th:value="${minPrice}" placeholder="Giá từ">
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" name="maxPrice" th:value="${maxPrice}" placeholder="Đến giá">
                            </div>
                            <div class="col-md-2">
                                <select class="form-select" name="sort">
                                    <option value="name" th:selected="${sort == 'name'}">Tên sản phẩm</option>
                                    <option value="price" th:selected="${sort == 'price'}">Giá</option>
                                    <option value="createdAt" th:selected="${sort == 'createdAt'}">Ngày tạo</option>
                                </select>
                            </div>
                            <div class="col-md-1">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Results Info -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h5>
                        <span th:if="${searchQuery}" th:text="'Kết quả tìm kiếm: ' + ${searchQuery}"></span>
                        <span th:unless="${searchQuery}">Tất cả sản phẩm</span>
                        <span class="text-muted">(<span th:text="${totalItems}"></span> sản phẩm)</span>
                    </h5>
                    <div class="btn-group" role="group">
                        <a th:href="@{/products(name=${name}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort='price', direction='asc')}" 
                           class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-sort-amount-up"></i> Giá tăng
                        </a>
                        <a th:href="@{/products(name=${name}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort='price', direction='desc')}" 
                           class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-sort-amount-down"></i> Giá giảm
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Products Grid -->
        <div class="row">
            <div th:each="product : ${products}" class="col-lg-3 col-md-4 col-sm-6 mb-4">
                <div class="card h-100 product-card">
                    <div class="product-image-container">
                        <img th:if="${product.imageUrl}" 
                             th:src="${product.imageUrl}" 
                             class="card-img-top product-image" 
                             th:alt="${product.name}">
                        <div th:unless="${product.imageUrl}" 
                             class="card-img-top bg-light d-flex align-items-center justify-content-center product-image-placeholder">
                            <i class="fas fa-image fa-2x text-muted"></i>
                        </div>
                        <div class="product-overlay">
                            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary btn-sm me-2">
                                <i class="fas fa-eye"></i> Xem chi tiết
                            </a>
                            <button class="btn btn-success btn-sm add-to-cart-btn" 
                                    th:data-product-id="${product.id}"
                                    th:disabled="${product.stockQuantity == 0}">
                                <i class="fas fa-shopping-cart"></i> Thêm vào giỏ
                            </button>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title text-truncate" th:text="${product.name}"></h6>
                        <p class="card-text text-muted small text-truncate" th:text="${product.description}"></p>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-bold text-primary" 
                                      th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                </span>
                                <span class="badge bg-success" th:text="${product.stockQuantity} + ' trong kho'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- No products message -->
            <div th:if="${#lists.isEmpty(products.content)}" class="col-12">
                <div class="text-center py-5">
                    <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">Không tìm thấy sản phẩm nào</h5>
                    <p class="text-muted">Thử thay đổi điều kiện tìm kiếm hoặc bộ lọc</p>
                </div>
            </div>
        </div>
        
        <!-- Pagination -->
        <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${currentPage - 1}, name=${name}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort}, direction=${direction})}">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                
                <!-- Show first page -->
                <li th:if="${currentPage > 2}" class="page-item">
                    <a class="page-link" th:href="@{/products(page=0, name=${name}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort}, direction=${direction})}">1</a>
                </li>
                
                <!-- Show ellipsis if needed -->
                <li th:if="${currentPage > 3}" class="page-item disabled">
                    <span class="page-link">...</span>
                </li>
                
                <!-- Show pages around current -->
                <li th:each="i : ${#numbers.sequence(T(Java.lang.Math).max(0, currentPage - 1), T(Java.lang.Math).min(totalPages - 1, currentPage + 1))}" 
                    class="page-item" 
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/products(page=${i}, name=${name}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort}, direction=${direction})}" 
                       th:text="${i + 1}"></a>
                </li>
                
                <!-- Show ellipsis if needed -->
                <li th:if="${currentPage < totalPages - 3}" class="page-item disabled">
                    <span class="page-link">...</span>
                </li>
                
                <!-- Show last page -->
                <li th:if="${currentPage < totalPages - 2}" class="page-item">
                    <a class="page-link" th:href="@{/products(page=${totalPages - 1}, name=${name}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort}, direction=${direction})}" 
                       th:text="${totalPages}"></a>
                </li>
                
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${currentPage + 1}, name=${name}, categoryId=${categoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort}, direction=${direction})}">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    
    <div th:replace="~{fragments/footer-client :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        .product-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .product-image-container {
            position: relative;
            overflow: hidden;
            height: 200px;
        }
        .product-image, .product-image-placeholder {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .product-image-container:hover .product-overlay {
            opacity: 1;
        }
    </style>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Add to cart functionality for home page
            document.querySelectorAll('.add-to-cart-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const productId = this.getAttribute('data-product-id');
                    
                    // Create form data
                    const formData = new FormData();
                    formData.append('productId', productId);
                    formData.append('quantity', 1);
                    
                    // Disable button temporarily
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang thêm...';
                    
                    // Submit to cart controller
                    fetch('/cart/add', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (response.redirected) {
                            window.location.href = response.url;
                        } else {
                            // Update cart count
                            updateCartCount();
                            // Show success message
                            this.innerHTML = '<i class="fas fa-check"></i> Đã thêm!';
                            this.classList.remove('btn-success');
                            this.classList.add('btn-success');
                            
                            // Reset button after 2 seconds
                            setTimeout(() => {
                                this.disabled = false;
                                this.innerHTML = '<i class="fas fa-shopping-cart"></i> Thêm vào giỏ';
                            }, 2000);
                        }
                    })
                    .catch(error => {
                        console.error('Error adding to cart:', error);
                        alert('Có lỗi xảy ra khi thêm vào giỏ hàng!');
                        // Reset button
                        this.disabled = false;
                        this.innerHTML = '<i class="fas fa-shopping-cart"></i> Thêm vào giỏ';
                    });
                });
            });
            
            // Update cart count function
            function updateCartCount() {
                fetch('/cart/count')
                    .then(response => response.text())
                    .then(count => {
                        const cartBadge = document.getElementById('cartCount');
                        if (cartBadge) {
                            cartBadge.textContent = count;
                            cartBadge.style.display = count > 0 ? 'flex' : 'none';
                        }
                    })
                    .catch(error => console.log('Cart count not available'));
            }
            
            // Initial cart count update
            updateCartCount();
        });
    </script>
</body>
</html>
