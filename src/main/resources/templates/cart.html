<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng của bạn</title>
    <!-- Include Bootstrap for basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar placeholder (if you have one) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Mini E-commerce</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/cart">Giỏ hàng (<span th:text="${totalQuantity}">0</span>)</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Giỏ hàng của bạn</h2>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
            Giỏ hàng của bạn đang trống. <a href="/">Tiếp tục mua sắm</a>
        </div>

        <div th:unless="${#lists.isEmpty(cartItems)}">
            <div class="row">
                <div class="col-md-8">
                    <table class="table table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Đơn giá</th>
                                <th>Số lượng</th>
                                <th>Thành tiền</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td th:text="${item.name}">Tên sản phẩm</td>
                                <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">100,000 VNĐ</td>
                                <td>
                                    <form th:action="@{/cart/update}" method="post" class="d-flex">
                                        <input type="hidden" name="productId" th:value="${item.productId}">
                                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control" style="width: 80px;" required>
                                        <button type="submit" class="btn btn-sm btn-primary ms-2">Cập nhật</button>
                                    </form>
                                </td>
                                <td th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">100,000 VNĐ</td>
                                <td>
                                    <form th:action="@{/cart/remove}" method="post">
                                        <input type="hidden" name="productId" th:value="${item.productId}">
                                        <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div class="text-end mb-4">
                        <h4>Tổng tiền: <span class="text-danger" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span></h4>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h5>Thông tin giao hàng</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/cart/checkout}" method="post" th:object="${order}">
                                <div class="mb-3">
                                    <label class="form-label">Họ tên người nhận</label>
                                    <input type="text" class="form-control" th:field="*{customerName}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" class="form-control" th:field="*{phone}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Địa chỉ giao hàng</label>
                                    <textarea class="form-control" th:field="*{address}" rows="3" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Tiến hành thanh toán</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
