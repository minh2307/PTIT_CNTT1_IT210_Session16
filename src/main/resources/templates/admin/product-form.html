<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id == null ? 'Thêm Sản phẩm' : 'Sửa Sản phẩm'}">Form Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header">
                        <h4 th:text="${product.id == null ? 'Thêm Sản phẩm Mới' : 'Sửa Sản phẩm'}">
                            Form Sản phẩm
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{${product.id == null ? '/admin/products/add' : '/admin/products/edit/' + product.id}}" 
                              th:object="${product}" method="post" enctype="multipart/form-data">
                              
                            <input type="hidden" th:if="${product.id != null}" th:field="*{id}"/>
                            <input type="hidden" th:if="${product.id != null}" th:field="*{createdAt}"/>
                            
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="description" class="form-label">Mô tả</label>
                                        <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="price" class="form-label">Giá (VNĐ) <span class="text-danger">*</span></label>
                                                <input type="number" class="form-control" id="price" th:field="*{price}" 
                                                       min="0" step="1000" required>
                                                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="stockQuantity" class="form-label">Số lượng tồn kho <span class="text-danger">*</span></label>
                                                <input type="number" class="form-control" id="stockQuantity" th:field="*{stockQuantity}" 
                                                       min="0" required>
                                                <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="category" class="form-label">Danh mục <span class="text-danger">*</span></label>
                                        <select class="form-select" id="category" th:field="*{category.id}" required>
                                            <option value="">-- Chọn danh mục --</option>
                                            <option th:each="cat : ${categories}" 
                                                    th:value="${cat.id}" 
                                                    th:text="${cat.name}"
                                                    th:selected="${product.category != null and product.category.id == cat.id}">
                                            </option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('category.id')}" th:errors="*{category.id}"></div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="imageUrl" class="form-label">URL Hình ảnh</label>
                                        <input type="url" class="form-control" id="imageUrl" th:field="*{imageUrl}" 
                                               placeholder="https://example.com/image.jpg">
                                        <div class="form-text">Nhập URL hình ảnh sản phẩm hoặc để trống</div>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
                                    </div>
                                </div>
                                
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">Xem trước hình ảnh</label>
                                        <div class="border rounded p-3 text-center bg-light" style="min-height: 200px;">
                                            <img th:if="${product.imageUrl}" 
                                                 th:src="${product.imageUrl}" 
                                                 class="img-fluid" 
                                                 style="max-height: 180px;"
                                                 th:alt="${product.name}"
                                                 id="previewImage">
                                            <div th:unless="${product.imageUrl}" 
                                                 class="d-flex align-items-center justify-content-center h-100">
                                                <div class="text-muted">
                                                    <i class="fas fa-image fa-3x mb-2"></i>
                                                    <p class="mb-0">Không có hình ảnh</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="/admin/products" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> 
                                    <span th:text="${product.id == null ? 'Thêm' : 'Cập nhật'}">Lưu</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-kit-code.js" crossorigin="anonymous"></script>
    <script>
        document.getElementById('imageUrl').addEventListener('input', function(e) {
            const url = e.target.value;
            const preview = document.getElementById('previewImage');
            const container = preview.parentElement;
            
            if (url) {
                preview.src = url;
                preview.onerror = function() {
                    container.innerHTML = `
                        <div class="d-flex align-items-center justify-content-center h-100">
                            <div class="text-muted">
                                <i class="fas fa-exclamation-triangle fa-3x mb-2"></i>
                                <p class="mb-0">Không thể tải hình ảnh</p>
                            </div>
                        </div>
                    `;
                };
            } else {
                container.innerHTML = `
                    <div class="d-flex align-items-center justify-content-center h-100">
                        <div class="text-muted">
                            <i class="fas fa-image fa-3x mb-2"></i>
                            <p class="mb-0">Không có hình ảnh</p>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
